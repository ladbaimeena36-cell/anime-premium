<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Anime AI Premium</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
background:#0f0f0f;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
overflow:hidden;
}

.ai-container{
width:90%;
max-width:800px;
height:90vh;
background:#151515;
border-radius:25px;
padding:20px;
box-shadow:
0 0 20px rgba(255,165,0,0.5),
0 0 60px rgba(255,165,0,0.2);
display:flex;
flex-direction:column;
border:2px solid rgba(255,165,0,0.3);
}

.title{
font-size:2rem;
font-weight:700;
color:#ffb347;
text-align:center;
margin-bottom:20px;
text-shadow:0 0 15px orange;
}

#chat-box{
flex:1;
overflow-y:auto;
padding:15px;
background:#111;
border-radius:20px;
border:1px solid rgba(255,255,255,0.05);
scroll-behavior:smooth;
}

.message{
margin-bottom:18px;
padding:14px;
border-radius:15px;
line-height:1.6;
animation:fadeIn .3s ease;
}

.user{
background:#ff9800;
color:#111;
margin-left:80px;
font-weight:600;
}

.bot{
background:#222;
color:#fff;
margin-right:80px;
border:1px solid rgba(255,165,0,0.2);
}

.input-area{
display:flex;
gap:12px;
margin-top:18px;
}

#user-input{
flex:1;
padding:16px;
border:none;
border-radius:15px;
background:#222;
color:white;
font-size:16px;
outline:none;
}

button{
padding:16px 28px;
border:none;
border-radius:15px;
background:linear-gradient(45deg,#ff9800,#ffb347);
color:#111;
font-weight:700;
cursor:pointer;
transition:0.3s;
}

button:hover{
transform:scale(1.05);
box-shadow:0 0 20px orange;
}

.typing{
opacity:0.7;
font-style:italic;
}

@keyframes fadeIn{
from{
opacity:0;
transform:translateY(10px);
}
to{
opacity:1;
transform:translateY(0);
}
}

</style>
</head>
<body>

<div class="ai-container">

<div class="title">
🔥 Anime AI Premium
</div>

<div id="chat-box"></div>

<div class="input-area">

<input
type="text"
id="user-input"
placeholder="Talk with Anime AI..."
/>

<button onclick="sendMessage()">
Send
</button>

</div>

</div>

<script>

const API_KEY = "AIzaSyAE4EvBAvHxuxJZy65hY1BcZWGNG_QVyxI";

const chatBox = document.getElementById("chat-box");
const userInput = document.getElementById("user-input");

function addMessage(text,type){

const msg = document.createElement("div");

msg.classList.add("message");

if(type === "user"){
msg.classList.add("user");
}else{
msg.classList.add("bot");
}

msg.innerHTML = text;

chatBox.appendChild(msg);

chatBox.scrollTop = chatBox.scrollHeight;

}

async function sendMessage(){

const message = userInput.value.trim();

if(!message) return;

addMessage(message,"user");

userInput.value = "";

const typingDiv = document.createElement("div");

typingDiv.classList.add("message","bot","typing");

typingDiv.innerHTML = "Anime AI is typing...";

chatBox.appendChild(typingDiv);

chatBox.scrollTop = chatBox.scrollHeight;

try{

const response = await fetch(
`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${API_KEY}`,
{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({
contents:[
{
parts:[
{
text:message
}
]
}
]
})
}
);

const data = await response.json();

typingDiv.remove();

const botReply =
data.candidates?.[0]?.content?.parts?.[0]?.text
||
"Anime AI could not reply.";

addMessage(botReply,"bot");

}catch(error){

typingDiv.remove();

addMessage("Error connecting to Gemini AI","bot");

console.log(error);

}

}

userInput.addEventListener("keypress",function(e){

if(e.key === "Enter"){
sendMessage();
}

});

</script>

</body>
</html>
