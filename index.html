```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Anime+ Premium Login</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
height:100vh;
background:
linear-gradient(rgba(0,0,0,0.7),rgba(0,0,0,0.8)),
url('https://images.unsplash.com/photo-1511512578047-dfb367046420?q=80&w=1974&auto=format&fit=crop');
background-size:cover;
background-position:center;
display:flex;
justify-content:center;
align-items:center;
overflow:hidden;
color:white;
}

.container{
width:380px;
padding:40px;
border-radius:25px;
backdrop-filter:blur(15px);
background:rgba(255,255,255,0.08);
border:1px solid rgba(255,255,255,0.2);
box-shadow:0 0 40px rgba(255,140,0,0.4);
animation:fadeIn 1s ease;
}

@keyframes fadeIn{
from{
opacity:0;
transform:translateY(40px);
}
to{
opacity:1;
transform:translateY(0);
}
}

.logo{
text-align:center;
font-size:35px;
font-weight:700;
margin-bottom:10px;
color:#ffb347;
text-shadow:0 0 20px orange;
}

.subtitle{
text-align:center;
font-size:14px;
opacity:0.8;
margin-bottom:30px;
}

input{
width:100%;
padding:14px;
margin:10px 0;
border:none;
outline:none;
border-radius:12px;
background:rgba(255,255,255,0.12);
color:white;
font-size:15px;
}

input::placeholder{
color:#ddd;
}

button{
width:100%;
padding:14px;
margin-top:20px;
border:none;
border-radius:14px;
background:linear-gradient(45deg,#ff9800,#ff5722);
color:white;
font-size:16px;
font-weight:600;
cursor:pointer;
transition:0.3s;
}

button:hover{
transform:scale(1.05);
box-shadow:0 0 20px orange;
}

.switch{
margin-top:20px;
text-align:center;
font-size:14px;
}

.switch span{
color:#ffb347;
cursor:pointer;
font-weight:bold;
}

.home{
display:none;
text-align:center;
}

.home h1{
font-size:40px;
margin-bottom:20px;
color:#ffb347;
}

.home p{
margin-bottom:30px;
}

.logout{
background:red;
}

.anime-card{
margin-top:25px;
padding:20px;
border-radius:18px;
background:rgba(255,255,255,0.08);
}

.anime-card img{
width:100%;
border-radius:15px;
margin-bottom:15px;
}

</style>
</head>

<body>

<div class="container">

<div id="authBox">

<div class="logo">ANIME+ 🔥</div>
<div class="subtitle">Premium Anime Universe</div>

<input type="text" id="username" placeholder="Enter Username">
<input type="password" id="password" placeholder="Enter Password">

<button onclick="signup()">Signup</button>
<button onclick="login()">Login</button>

<div class="switch">
Already a member? <span>Welcome Otaku 👀</span>
</div>

</div>

<div class="home" id="homePage">

<h1>Welcome 🎌</h1>

<p id="welcomeText"></p>

<div class="anime-card">

<img src="https://images.unsplash.com/photo-1542751110-97427bbecf20?q=80&w=1974&auto=format&fit=crop">

<h2>Shadow Samurai</h2>

<p>Enter the world of legendary battles and epic anime adventures.</p>

</div>

<button class="logout" onclick="logout()">Logout</button>

</div>

</div>

<script>

const authBox = document.getElementById("authBox");
const homePage = document.getElementById("homePage");
const welcomeText = document.getElementById("welcomeText");

function signup(){

const username = document.getElementById("username").value;
const password = document.getElementById("password").value;

if(username === "" || password === ""){
alert("Please fill all fields");
return;
}

localStorage.setItem("animeUser", username);
localStorage.setItem("animePass", password);

alert("Signup Successful 🔥");

}

function login(){

const username = document.getElementById("username").value;
const password = document.getElementById("password").value;

const savedUser = localStorage.getItem("animeUser");
const savedPass = localStorage.getItem("animePass");

if(username === savedUser && password === savedPass){

authBox.style.display = "none";
homePage.style.display = "block";

welcomeText.innerHTML = "Hello " + username + " 👋";

}
else{
alert("Wrong Username or Password");
}

}

function logout(){

homePage.style.display = "none";
authBox.style.display = "block";

}

</script>

</body>
</html>
