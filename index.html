<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Anime AI Premium</title>

<style>

body{
    margin:0;
    padding:0;
    background:#111;
    font-family:Arial;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.chat-container{
    width:420px;
    height:650px;
    background:#1b1b1b;
    border-radius:25px;
    padding:20px;
    box-shadow:0 0 40px orange;
    display:flex;
    flex-direction:column;
}

h1{
    color:#ffb347;
    text-align:center;
}

#chat-box{
    flex:1;
    overflow-y:auto;
    margin-top:20px;
    padding:10px;
}

.message{
    padding:12px;
    border-radius:15px;
    margin-bottom:12px;
    max-width:80%;
    word-wrap:break-word;
}

.user{
    background:orange;
    color:black;
    margin-left:auto;
}

.bot{
    background:#444;
    color:white;
}

.input-area{
    display:flex;
    gap:10px;
}

input{
    flex:1;
    padding:15px;
    border:none;
    border-radius:15px;
    background:#333;
    color:white;
    font-size:16px;
}

button{
    padding:15px 20px;
    border:none;
    border-radius:15px;
    background:orange;
    font-weight:bold;
    cursor:pointer;
}

</style>
</head>

<body>

<div class="chat-container">

<h1>🔥 Anime AI Premium</h1>

<div id="chat-box"></div>

<div class="input-area">

<input
type="text"
id="user-input"
placeholder="Talk with Anime AI..."
>

<button onclick="sendMessage()">
Send
</button>

</div>

</div>

<script>

const API_KEY = "AIzaSyAE4EvBAvHxuxJZy65hY1BcZWGNG_QVyxI";

const chatBox = document.getElementById("chat-box");
const userInput = document.getElementById("user-input");

function addMessage(sender,text){

    const msg = document.createElement("div");

    msg.classList.add("message");

    if(sender === "user"){
        msg.classList.add("user");
    }else{
        msg.classList.add("bot");
    }

    msg.innerText = text;

    chatBox.appendChild(msg);

    chatBox.scrollTop = chatBox.scrollHeight;
}

async function sendMessage(){

    const text = userInput.value.trim();

    if(!text) return;

    addMessage("user", text);

    userInput.value = "";

    try{

        const response = await fetch(
        "https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=" + API_KEY,
        {
            method:"POST",

            headers:{
                "Content-Type":"application/json"
            },

            body:JSON.stringify({
                contents:[
                    {
                        parts:[
                            {
                                text:text
                            }
                        ]
                    }
                ]
            })
        });

        const data = await response.json();

        console.log(data);

        const reply =
        data.candidates[0].content.parts[0].text;

        addMessage("bot", reply);

    }catch(error){

        console.log(error);

        addMessage("bot","AI failed to reply.");
    }
}

userInput.addEventListener("keydown",function(e){

    if(e.key === "Enter"){
        sendMessage();
    }

});

</script>

</body>
</html>
