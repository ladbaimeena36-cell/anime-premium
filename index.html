<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Anime AI Premium</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    background:black;
    color:white;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;
}

body::before{
    content:'';
    position:absolute;
    width:500px;
    height:500px;
    background:orange;
    filter:blur(200px);
    opacity:0.3;
    top:-100px;
    left:-100px;
}

body::after{
    content:'';
    position:absolute;
    width:500px;
    height:500px;
    background:red;
    filter:blur(200px);
    opacity:0.2;
    bottom:-100px;
    right:-100px;
}

.ai-container{
    position:relative;
    z-index:2;
    width:90%;
    max-width:800px;
    background:rgba(20,20,20,0.8);
    backdrop-filter:blur(10px);
    border:1px solid rgba(255,255,255,0.1);
    border-radius:25px;
    padding:25px;
    box-shadow:0 0 40px rgba(255,165,0,0.3);
}

.logo{
    text-align:center;
    font-size:40px;
    font-weight:700;
    margin-bottom:20px;
    color:orange;
    text-shadow:0 0 20px orange;
}

#chat-box{
    height:450px;
    overflow-y:auto;
    background:#111;
    border-radius:20px;
    padding:20px;
    margin-bottom:20px;
}

.message{
    margin-bottom:20px;
    padding:15px;
    border-radius:15px;
    line-height:1.6;
    animation:fade 0.3s ease;
}

.user{
    background:orange;
    color:black;
}

.bot{
    background:#222;
    border:1px solid rgba(255,255,255,0.1);
}

@keyframes fade{
    from{
        opacity:0;
        transform:translateY(10px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

.input-area{
    display:flex;
    gap:10px;
}

input{
    flex:1;
    padding:18px;
    border:none;
    outline:none;
    border-radius:15px;
    background:#1a1a1a;
    color:white;
    font-size:16px;
}

button{
    padding:18px 30px;
    border:none;
    border-radius:15px;
    background:orange;
    color:black;
    font-weight:700;
    cursor:pointer;
    transition:0.3s;
}

button:hover{
    transform:scale(1.05);
    box-shadow:0 0 20px orange;
}

::-webkit-scrollbar{
    width:8px;
}

::-webkit-scrollbar-thumb{
    background:orange;
    border-radius:20px;
}

</style>
</head>

<body>

<div class="ai-container">

<div class="logo">
🔥 Anime AI Premium
</div>

<div id="chat-box"></div>

<div class="input-area">

<input
type="text"
id="user-input"
placeholder="Talk with Anime AI..."
/>

<button onclick="sendMessage()">
Send
</button>

</div>

</div>

<script>

const API_KEY = AIzaSyAE4EvBAvHxuxJZy65hY1BcZWGNG_QVyxI

const chatBox = document.getElementById("chat-box");
const input = document.getElementById("user-input");

function addMessage(sender,text,type){

    const msg = document.createElement("div");

    msg.classList.add("message");
    msg.classList.add(type);

    msg.innerHTML = `
        <strong>${sender}</strong>
        <p>${text}</p>
    `;

    chatBox.appendChild(msg);

    chatBox.scrollTop = chatBox.scrollHeight;
}

async function sendMessage(){

    const userMessage = input.value;

    if(!userMessage) return;

    addMessage("You",userMessage,"user");

    input.value = "";

    try{

        const response = await fetch(
        `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${API_KEY}`,
        {
            method:"POST",

            headers:{
                "Content-Type":"application/json"
            },

            body:JSON.stringify({
                contents:[
                    {
                        parts:[
                            {
                                text:userMessage
                            }
                        ]
                    }
                ]
            })
        });

        const data = await response.json();

        const reply =
        data.candidates?.[0]?.content?.parts?.[0]?.text
        || "Anime AI has no response.";

        addMessage("Anime AI",reply,"bot");

    }

    catch(error){

        addMessage(
        "Anime AI",
        "Error connecting to AI.",
        "bot"
        );

        console.log(error);
    }
}

input.addEventListener("keypress",function(e){

    if(e.key==="Enter"){
        sendMessage();
    }

});

</script>

</body>
</html>
