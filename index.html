<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Anime AI Premium</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    background:#0f0f0f;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    overflow:hidden;
}

.chat-container{
    width:90%;
    max-width:900px;
    height:90vh;
    background:#181818;
    border-radius:25px;
    padding:20px;
    box-shadow:0 0 40px orange;
    display:flex;
    flex-direction:column;
}

.title{
    color:#ffb347;
    font-size:38px;
    font-weight:700;
    margin-bottom:20px;
    text-shadow:0 0 15px orange;
}

#chat-box{
    flex:1;
    overflow-y:auto;
    padding-right:10px;
}

.message{
    max-width:80%;
    padding:15px 20px;
    margin:15px 0;
    border-radius:18px;
    font-size:17px;
    line-height:1.5;
    word-wrap:break-word;
}

.user{
    background:linear-gradient(45deg,#ffb347,#ffcc33);
    color:#000;
    margin-left:auto;
    box-shadow:0 0 15px #ffb347;
}

.bot{
    background:#2c2c2c;
    color:#fff;
    margin-right:auto;
    box-shadow:0 0 10px rgba(255,255,255,0.2);
}

.input-area{
    display:flex;
    gap:12px;
    margin-top:15px;
}

#user-input{
    flex:1;
    padding:18px;
    border:none;
    outline:none;
    border-radius:15px;
    background:#2b2b2b;
    color:white;
    font-size:16px;
}

button{
    padding:16px 28px;
    border:none;
    border-radius:15px;
    background:linear-gradient(45deg,#ffb347,#ffcc33);
    color:black;
    font-weight:700;
    cursor:pointer;
    transition:0.3s;
    box-shadow:0 0 15px orange;
}

button:hover{
    transform:scale(1.05);
}

::-webkit-scrollbar{
    width:8px;
}

::-webkit-scrollbar-thumb{
    background:orange;
    border-radius:10px;
}

</style>
</head>

<body>

<div class="chat-container">

    <div class="title">
        🔥 Anime AI Premium
    </div>

    <div id="chat-box"></div>

    <div class="input-area">

        <input
            type="text"
            id="user-input"
            placeholder="Talk with Anime AI..."
        >

        <button onclick="sendMessage()">
            Send
        </button>

    </div>

</div>

<script>

const API_KEY = "AIzaSyAE4EvBAvHxuxJZy65hY1BcZWGNG_QVyxI";

const chatBox = document.getElementById("chat-box");
const userInput = document.getElementById("user-input");

function addMessage(sender,text){

    const msg = document.createElement("div");

    msg.classList.add("message");

    if(sender === "user"){
        msg.classList.add("user");
    }else{
        msg.classList.add("bot");
    }

    msg.innerText = text;

    chatBox.appendChild(msg);

    chatBox.scrollTop = chatBox.scrollHeight;
}

async function sendMessage(){

    const text = userInput.value.trim();

    if(!text) return;

    addMessage("user",text);

    userInput.value = "";

    try{

        const response = await fetch(
            `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${API_KEY}`,
            {
                method:"POST",

                headers:{
                    "Content-Type":"application/json"
                },

                body:JSON.stringify({
                    contents:[
                        {
                            parts:[
                                {
                                    text:text
                                }
                            ]
                        }
                    ]
                })
            }
        );

        const data = await response.json();

        console.log(data);

        const reply =
        data.candidates[0].content.parts[0].text;

        addMessage("bot",reply);

    }
    catch(error){

        console.log(error);

        addMessage(
            "bot",
            "Anime AI could not reply."
        );
    }
}

userInput.addEventListener("keypress",function(e){

    if(e.key === "Enter"){
        sendMessage();
    }

});

</script>

</body>
</html>
