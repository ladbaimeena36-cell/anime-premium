<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Anime AI Premium</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    background:#0d0d0d;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.chat-container{
    width:90%;
    max-width:900px;
    height:90vh;
    background:#181818;
    border-radius:25px;
    padding:20px;
    box-shadow:0 0 40px rgba(255,165,0,0.5);
    border:1px solid rgba(255,165,0,0.3);
    display:flex;
    flex-direction:column;
}

.title{
    color:#ffb347;
    font-size:38px;
    font-weight:700;
    margin-bottom:20px;
    text-shadow:0 0 15px orange;
}

#chat-box{
    flex:1;
    overflow-y:auto;
    padding-right:10px;
}

.message{
    max-width:80%;
    padding:15px 20px;
    margin:12px 0;
    border-radius:18px;
    line-height:1.5;
    font-size:16px;
    white-space:pre-wrap;
}

.user{
    margin-left:auto;
    background:linear-gradient(45deg,#ffb347,#ffcc33);
    color:black;
    font-weight:600;
    box-shadow:0 0 15px rgba(255,179,71,0.5);
}

.bot{
    margin-right:auto;
    background:#2c2c2c;
    color:white;
}

.input-area{
    display:flex;
    gap:10px;
    margin-top:15px;
}

#user-input{
    flex:1;
    padding:18px;
    border:none;
    outline:none;
    border-radius:14px;
    background:#252525;
    color:white;
    font-size:16px;
}

button{
    border:none;
    padding:0 28px;
    border-radius:14px;
    cursor:pointer;
    background:linear-gradient(45deg,#ffb347,#ffcc33);
    color:black;
    font-weight:700;
    font-size:16px;
    box-shadow:0 0 15px rgba(255,179,71,0.5);
    transition:0.3s;
}

button:hover{
    transform:scale(1.05);
}

::-webkit-scrollbar{
    width:7px;
}

::-webkit-scrollbar-thumb{
    background:orange;
    border-radius:10px;
}

</style>
</head>

<body>

<div class="chat-container">

    <div class="title">
        🔥 Anime AI Premium
    </div>

    <div id="chat-box"></div>

    <div class="input-area">

        <input
            type="text"
            id="user-input"
            placeholder="Talk with Anime AI..."
        >

        <button onclick="sendMessage()">
            Send
        </button>

    </div>

</div>

<script>

const API_KEY = "AIzaSyAE4EvBAvHxuxJZy65hY1BcZWGNG_QVyxI";

const chatBox = document.getElementById("chat-box");
const userInput = document.getElementById("user-input");

function addMessage(sender,text){

    const div = document.createElement("div");

    div.classList.add("message");

    if(sender === "user"){
        div.classList.add("user");
    }else{
        div.classList.add("bot");
    }

    div.innerText = text;

    chatBox.appendChild(div);

    chatBox.scrollTop = chatBox.scrollHeight;
}

async function sendMessage(){

    const text = userInput.value.trim();

    if(text === "") return;

    addMessage("user",text);

    userInput.value = "";

    try{

       const response = await fetch(
`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${API_KEY}`,
{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({
contents:[
{
parts:[
{
text:text
}
]
}
]
})
}
);

        const data = await response.json();

        console.log(data);

        const reply =
        data?.candidates?.[0]?.content?.parts?.[0]?.text;

        if(reply){

            addMessage("bot",reply);

        }else{

            addMessage(
                "bot",
                "AI reply nahi de paaya."
            );
        }

    }catch(error){

        console.log(error);

        addMessage(
            "bot",
            "Connection error."
        );
    }
}

userInput.addEventListener("keypress",function(e){

    if(e.key === "Enter"){
        sendMessage();
    }

});

</script>

</body>
</html>
